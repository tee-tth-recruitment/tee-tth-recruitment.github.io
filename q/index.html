<h1>এটা পরীক্ষার হলের উপস্থিতির কোড</h1>
<p>এই QR কোড শুধু পরীক্ষার দিন দায়িত্বপ্রাপ্ত শিক্ষক স্ক্যান করবেন। নিজে স্ক্যান করলে কিছু হবে না, উপস্থিতিও পড়বে না।</p>
<p>প্রবেশপত্র ভাঁজ না করে, ছাপা কপি সঙ্গে আনুন।</p>
