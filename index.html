<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শিক্ষক নিয়োগ ২০২৭</title>
<meta name="theme-color" content="#0f1a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/tth-logo.png">
<link rel="apple-touch-icon" href="assets/tth-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Baloo+Da+2:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* =========================================================
 *  শিক্ষক নিয়োগ ২০২৭ — অফিসের অ্যাপ
 *  API_URL = Apps Script ("Anyone" deployment)-এর /exec লিংক।
 *  পাতাটা খোলা, কিন্তু কোনো তথ্য রাখে না; নিরাপত্তা = লগইন টোকেন (সার্ভার যাচাই করে)।
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbyfL1EUYdUrfEqIwvBVi2Ia8J8sEqXA4Byo78EaccmH-9oIb3YAnHil0SjlUS-YdFCH/exec';

// github.io-র সব পাতা এক জায়গায় জিনিস রাখে — তাই প্রতিটা চাবি "rc_" দিয়ে শুরু
var AUTH_KEY = 'rc_auth', BOOT_KEY = 'rc_boot_v1';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(BOOT_KEY); } } catch (e) {}
}

var THEME = 'dark';
try { THEME = localStorage.getItem('rc_theme') || 'dark'; } catch (e) {}
function applyTheme() {
  var t = THEME === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

/* text/plain POST — preflight লাগে না; ৪৫ সেকেন্ডে না এলে থামে */
function callServer(fn, args) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, 45000) : 0;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH }),
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    clearTimeout(tm);
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ')');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি।'); });
  }, function () {
    clearTimeout(tm);
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা ত্রুটি।');
    return j.data;
  });
}

/* ব্যক্তিগত লোগো "Matra Logic" — Developed By-এর সামনে */
function markSvg(cls) {
  return '<svg class="mk ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="mkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c77d"/><stop offset="1" stop-color="#c39a45"/></linearGradient></defs>' +
    '<path d="M8 18H92M16 88 40 18 64 88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M84 18V88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round"/>' +
    '<circle cx="40" cy="64" r="7.5" fill="url(#mkg)"/></svg>';
}
</script>
<style>
:root{
  --bg:#0b1226;--bg2:#101a36;--card:#141f3f;--card2:#1a2750;--line:#26355f;--line2:#33447a;
  --tx:#e9eefb;--tx2:#aab6d6;--tx3:#7b88ab;--acc:#e6c77d;--acc2:#c39a45;--pri:#5b8cff;--pri2:#3f6fe6;
  --ok:#34d399;--okb:rgba(52,211,153,.14);--bad:#f87171;--badb:rgba(248,113,113,.14);--warn:#fbbf24;--warnb:rgba(251,191,36,.14);--info:#60a5fa;--infob:rgba(96,165,250,.14);
  --sh:0 10px 30px rgba(0,0,0,.35);--r:14px;
}
:root[data-theme="light"]{
  --bg:#f3f5fb;--bg2:#e9edf7;--card:#ffffff;--card2:#f6f8fd;--line:#dde3f0;--line2:#c9d2e6;
  --tx:#14203f;--tx2:#4a5675;--tx3:#7b86a3;--acc:#a8802f;--acc2:#8a6620;--pri:#2d5be3;--pri2:#2047bd;
  --ok:#0f9f6e;--okb:rgba(15,159,110,.1);--bad:#d33b3b;--badb:rgba(211,59,59,.09);--warn:#b7791f;--warnb:rgba(183,121,31,.1);--info:#2563eb;--infob:rgba(37,99,235,.08);
  --sh:0 8px 24px rgba(20,32,63,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hide{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- লগইন ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 15% 0%,rgba(91,140,255,.18),transparent 70%),radial-gradient(600px 400px at 90% 100%,rgba(230,199,125,.14),transparent 70%),var(--bg)}
.gbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--sh)}
.glogos{display:flex;justify-content:center;gap:14px;margin-bottom:14px}
.glogos img{width:62px;height:62px;border-radius:50%;background:#fff;object-fit:contain;padding:3px;box-shadow:0 0 0 2px var(--acc)}
.gbox h1{margin:0;text-align:center;font-family:'Baloo Da 2',sans-serif;font-size:26px;line-height:1.2}
.gbox .sub{text-align:center;color:var(--tx2);margin:6px 0 20px;font-size:14px}
.gbox label{display:block;font-size:13px;color:var(--tx2);margin:12px 0 6px}
.gmsg{min-height:20px;font-size:13px;margin-top:10px;color:var(--bad)}
.gmsg.ok{color:var(--ok)}

/* ---------- কাঠামো ---------- */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
.brand b{font-family:'Baloo Da 2',sans-serif;font-size:18px;line-height:1.1;display:block}
.brand small{color:var(--tx3);font-size:12px}
.me{margin:0 8px 12px;padding:8px 12px;border-radius:999px;background:linear-gradient(90deg,rgba(230,199,125,.22),rgba(230,199,125,.06));border:1px solid rgba(230,199,125,.4);font-size:13px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--tx2);cursor:pointer;text-align:left;font-size:14.5px}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nav .cnt{margin-left:auto;background:var(--badb);color:var(--bad);border-radius:999px;padding:0 8px;font-size:12px}
.dev{font-size:11.5px;color:var(--tx3);padding:12px 8px 0;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:10px}
.dev .mk{width:16px;height:16px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none}
.page{padding:22px 26px 90px;max-width:1180px;width:100%}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{margin:0;font-family:'Baloo Da 2',sans-serif;font-size:26px;line-height:1.2}
.ph .sp{flex:1}
.bnav{display:none}

@media (max-width:860px){
  .side{display:none}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .top img{width:32px;height:32px;border-radius:50%;background:#fff;padding:2px}
  .top b{font-family:'Baloo Da 2',sans-serif;font-size:17px;flex:1}
  .page{padding:16px 14px 96px}
  .ph h2{font-size:22px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);z-index:30;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--tx3);cursor:pointer}
  .bnav button.on{color:var(--acc)}
}

/* ---------- টুকরো ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}
.card h3{margin:0 0 12px;font-size:16.5px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.muted{color:var(--tx2)}.tiny{font-size:12.5px;color:var(--tx3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;color:inherit}
.stat:hover{border-color:var(--line2)}
.stat small{color:var(--tx2);font-size:13px;display:block}
.stat b{font-size:28px;font-weight:800;display:block;margin-top:2px}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.acc b{color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.gold{background:linear-gradient(180deg,var(--acc),var(--acc2));border-color:var(--acc2);color:#1b1404}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04261a}
.btn.bad{color:var(--bad);border-color:rgba(248,113,113,.45);background:var(--badb)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in,.sel,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none}
.in:focus,.sel:focus{border-color:var(--pri)}
textarea.in{min-height:90px;resize:vertical;line-height:1.55}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
.fld>label.sw{display:inline-flex;color:var(--tx);font-size:14px;margin-bottom:0}
.fld .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badb);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warnb);color:var(--warn);border-color:transparent}.chip.info{background:var(--infob);color:var(--info);border-color:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--tx2);font-size:13.5px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs button span{opacity:.8;margin-left:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar .in,.bar .sel{width:auto;flex:1;min-width:160px}
.note{padding:10px 12px;border-radius:10px;background:var(--infob);color:var(--tx);font-size:13.5px;line-height:1.55;border:1px solid transparent}
.note.warn{background:var(--warnb)}.note.bad{background:var(--badb)}.note.ok{background:var(--okb)}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{left:21px}

/* তালিকা */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.row:hover{border-color:var(--line2)}
.row .rl{font-weight:800;color:var(--acc);min-width:66px;font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--tx3);font-size:12.5px}
.empty{padding:40px 10px;text-align:center;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:36px;height:36px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--tx2);font-weight:600;font-size:13px}
table.t th.r,table.t td.r{text-align:right}
#mkBox table.t td{vertical-align:middle;padding:5px 10px}#mkBox input.mk{padding:7px 8px;font-size:16px}#rsGrp table.t td{vertical-align:middle;padding:6px 10px}
.tw{overflow:auto}

/* শ্রেণি-বিষয় */
.cls{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--card)}
.cls .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line)}
.cls .ch .in{max-width:220px;font-weight:700}
.cls .sr{display:grid;grid-template-columns:28px minmax(0,1fr) 90px auto auto;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.cls .sr:last-child{border-bottom:0}
.cls .sr .n{color:var(--tx3);font-size:12px;text-align:right}
.cls .sr.off .in{opacity:.5;text-decoration:line-through}
.cls .use{font-size:11.5px;color:var(--info)}
@media (max-width:600px){.cls .sr{grid-template-columns:minmax(0,1fr) 70px auto}.cls .sr .n,.cls .sr .mv{display:none}}

/* ড্রয়ার / মোডাল */
.ov{position:fixed;inset:0;background:rgba(5,10,25,.6);z-index:50;display:flex;justify-content:flex-end}
.dr{width:min(560px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 40px;animation:slin .18s ease}
@keyframes slin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dr .dh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dr .dh h3{margin:0;flex:1;font-size:19px}
.md{margin:auto;width:min(480px,94%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);max-height:94vh;overflow:auto}
.ov.c{justify-content:center;align-items:center}
.pf{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.pf .ph35{width:105px;height:135px;border-radius:8px;background:var(--card2);border:1px solid var(--line);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--tx3);font-size:12px;text-align:center}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;font-size:14px}
.kv dt{color:var(--tx3)}.kv dd{margin:0;word-break:break-word}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox .qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:10px}
.qrbox .qr svg{width:100%;height:100%}
.parts{font-size:12px;color:var(--tx3);margin-top:4px}.parts b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;max-width:92vw;font-size:14px}
.toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer}
.spin{width:18px;height:18px;border:2.5px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--tx3)}
.perm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.perm label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px}
.perm label small{display:block;color:var(--tx3);font-size:12px}
.rule-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:8px}
.rule-row .n{color:var(--tx3);padding-top:10px;text-align:right;font-size:13px}
.rule-row textarea.in{min-height:58px}

/* একসঙ্গে বাছাই */
.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex:none}
.ck input{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
.selrow{display:flex;align-items:center;gap:12px;margin:0 0 8px 14px;font-size:13.5px;color:var(--tx2)}
.row.picked{border-color:var(--acc);background:var(--card2)}
.bulk{position:sticky;bottom:12px;z-index:15;margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;box-shadow:var(--sh)}
.bulk b{color:var(--acc);margin-right:6px}
@media (max-width:860px){.bulk{bottom:72px}}

/* ফর্মের প্রশ্ন */
.qsec{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;background:var(--card)}
.qsech{background:var(--card2);border-bottom:1px solid var(--line)}
.qsech>.qtt{padding:12px 14px;font-weight:700}
.qcard{border-bottom:1px solid var(--line)}
.qcard:last-child{border-bottom:0}
.qcard.open{background:var(--bg2)}
.qrow{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.qrow.lk{cursor:default;opacity:.75}
.qrow:hover:not(.lk){background:var(--card2)}
.qtt{flex:1;min-width:0;font-weight:600}
.qtt small{color:var(--tx3);font-weight:500}
.qtt .nw{color:var(--acc)}
.qform{padding:4px 14px 14px}

/* আসন বিন্যাস */
table.rm .in{padding:7px 9px;min-width:70px}
table.rm td{vertical-align:middle}

/* উপস্থিতি */
.pbar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#6ee7b7)}

.rptl b{display:block;font-size:13.5px}.rptl small{color:var(--tx3)}

.rpf{display:grid;grid-template-columns:190px 1fr 56px 44px;gap:10px;align-items:center}.rpf span{font-size:14px}.rpf b{text-align:right;font-size:17px}.rpf small{color:var(--tx3);font-size:12px}

.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:14px;align-items:start}

.lkqr{width:118px!important;height:118px!important;flex:none;padding:6px!important}

.devlink{color:inherit;font-weight:700;text-decoration:none;border-bottom:1px dotted currentColor}.devlink:hover{color:var(--acc)}

/* ═══════════ অফিসের অ্যাপ — নতুন সাজ (২০২৬-১১-১৯) ═══════════ */
.side{width:262px;padding:16px 12px 12px;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.brand{padding:4px 6px 14px;gap:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.blogos{display:flex;flex:none}
.blogos img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;box-shadow:0 0 0 2px var(--bg2),0 4px 10px rgba(0,0,0,.25)}
.blogos img+img{margin-left:-12px}
.brand b{font-size:18.5px;line-height:1.25;padding-top:2px}
.brand small{display:block;margin-top:1px;color:var(--acc);font-size:11.5px;font-weight:600;letter-spacing:.2px}
.me{display:flex;align-items:center;gap:10px;margin:0 4px 12px;padding:8px 10px;border-radius:12px;white-space:normal;background:linear-gradient(90deg,rgba(230,199,125,.16),rgba(230,199,125,.04));border:1px solid rgba(230,199,125,.32)}
.me .av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#1b1404;font-weight:800;font-size:15px}
.me .mi{min-width:0}.me .mi b{display:block;color:var(--tx);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mi small{display:block;color:var(--acc);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{gap:2px;padding-right:2px;scrollbar-width:thin}
.ngrp{margin-bottom:6px}
.nhead{display:flex!important;align-items:center;justify-content:space-between;padding:8px 10px 4px!important;font-size:11.5px!important;font-weight:700;letter-spacing:.4px;color:var(--tx3)!important;background:none!important}
.nhead .ic{width:14px;height:14px;transition:transform .15s}
.ngrp.shut .nhead .ic{transform:rotate(-90deg)}
.ngrp.shut .nitems{display:none}
.nav button:not(.nhead){padding:8px 10px;gap:10px;font-size:14px;border-radius:9px}
.nav button .ic{width:18px;height:18px;flex:none;opacity:.85}
.nav button.on .ic{color:var(--acc);opacity:1}
.dev{flex-wrap:wrap;justify-content:center;gap:5px;line-height:1.5;text-align:center;padding:10px 4px 0}
.dev .devlink{white-space:nowrap}
.page{padding:22px 30px 90px;max-width:1240px}
.crumb{flex-basis:100%;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--acc);margin-bottom:-10px}
.ph h2{font-size:27px}
/* হোমের ওপরের কার্ড */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:center;margin-bottom:16px;padding:20px 22px;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(500px 220px at 0% 0%,rgba(230,199,125,.18),transparent 70%),radial-gradient(500px 260px at 100% 100%,rgba(91,140,255,.16),transparent 70%),var(--card)}
.hero .hl small{color:var(--tx2);font-size:14px}.hero .hl>b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:26px;line-height:1.3;margin:2px 0 6px}
.hnext{font-size:14px;color:var(--tx2)}.hnext span{color:var(--tx);font-weight:700}.hnext em{font-style:normal;margin-left:6px;padding:2px 10px;border-radius:999px;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#1b1404;font-weight:700;font-size:12.5px}
.hform{margin-top:10px;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:7px}
.hform .dot{width:9px;height:9px;border-radius:50%;background:var(--tx3)}.hform .dot.ok{background:var(--ok);box-shadow:0 0 0 4px var(--okb)}.hform .dot.bad{background:var(--bad)}
.htl{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.htl:before{content:'';position:absolute;left:12%;right:12%;top:9px;height:2px;background:var(--line2)}
.htl div{position:relative;text-align:center;padding:0 4px}
.htl i{display:block;width:20px;height:20px;margin:0 auto 8px;border-radius:50%;background:var(--card2);border:2px solid var(--line2)}
.htl .past i{background:var(--acc2);border-color:var(--acc2)}
.htl .now i{background:var(--bg);border-color:var(--acc);box-shadow:0 0 0 5px rgba(230,199,125,.25)}
.htl b{display:block;font-size:13px}.htl small{color:var(--tx3);font-size:12px}
.htl .now b{color:var(--acc)}
/* দ্রুত কাজ */
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;transition:border-color .15s,transform .15s}
.qa button:hover{border-color:var(--acc);transform:translateY(-1px)}
.qa .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px;background:rgba(230,199,125,.14);color:var(--acc)}
.qa .qi .ic{width:19px;height:19px}.qa b{font-size:14.5px}.qa small{color:var(--tx3);font-size:12px}
/* ফোন: ওপরের ফিতা, নিচের মেনু, "আরও" */
.top .blogos img{width:32px;height:32px}.top .blogos img+img{margin-left:-10px}
.top .tt{flex:1;min-width:0;line-height:1.25}.top .tt b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{display:block;font-size:11px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bnav button.on .ic{color:var(--acc)}
.ov.b{justify-content:center;align-items:flex-end}
.md.sheet{width:min(560px,100%);max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;margin:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:861px){.ov.b{align-items:center}.md.sheet{border-radius:18px}}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.shh b{font-family:'Baloo Da 2',sans-serif;font-size:19px}
.shg{margin-top:10px}.shg>small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--tx3);margin:0 2px 6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer;font-size:12.5px;text-align:center;line-height:1.35}
.tiles button .ic{width:20px;height:20px;color:var(--acc)}.tiles button.on{border-color:var(--acc)}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding:16px}
  .htl b{font-size:12px}.htl small{font-size:11px}
  .crumb{margin-bottom:-6px}
}
:root[data-theme="light"] .side{background:linear-gradient(180deg,#eef2fa,#e7ecf6)}
:root[data-theme="light"] .qa .qi{background:rgba(168,128,47,.12)}
.brand>div:last-child{min-width:0}.brand b{font-size:17px;white-space:nowrap}.brand small{white-space:nowrap}
.hnext em{white-space:nowrap;display:inline-block}

/* ব্যবহারকারী: ভূমিকার টাইল */
.rolepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.rt{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--tx);font:inherit}

.rt .rh b{flex:1;font-size:15px}
.rt .rh i{display:none;color:var(--acc)}.rt.on .rh i{display:inline-flex}
.rt .rk{font-size:12.5px;font-weight:700;color:var(--acc)}
.rt .rd{font-size:12.5px;color:var(--tx2);line-height:1.5}
.rt .rp{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rt .rp em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--infob);color:var(--info)}

.lockc h3{color:var(--tx2)}

/* প্রচার */
.prgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

.prc textarea.in{font-size:13px;min-height:150px}

/* ===== প্রতিবেদন (বসের পাতা) — প্রিমিয়াম ===== */
.rpx{--i1:#6366f1;--i2:#8b5cf6;--i3:#0ea5e9;--i4:#10b981;--i5:#f59e0b}

  background:radial-gradient(700px 300px at 90% -20%,rgba(230,199,125,.35),transparent 60%),radial-gradient(600px 300px at -10% 120%,rgba(139,92,246,.45),transparent 60%),linear-gradient(135deg,#0b1838 0%,#13265a 45%,#2a2f7a 100%);
  box-shadow:0 18px 40px rgba(11,24,56,.35);border:1px solid rgba(230,199,125,.25)}

.rx-upd{margin-top:10px;font-size:12.5px;opacity:.75}
.rx-ring{position:relative;display:flex;align-items:center;gap:16px}
.rx-ringin{width:118px;height:118px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle,#1d3478,#0b1838);border:5px solid #e6c77d;box-shadow:0 0 0 7px rgba(230,199,125,.18),inset 0 0 18px rgba(0,0,0,.4)}

.rx-next small{display:block;font-size:12px;opacity:.75}.rx-next b{display:block;font-size:17px;line-height:1.3}.rx-next span{font-size:14px;color:#e6c77d;font-weight:700}

.rx-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0}

.rx-kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--g)}

.rx-kpi.k4{--g:linear-gradient(135deg,#10b981,#84cc16)}.rx-kpi.k5{--g:linear-gradient(135deg,#f59e0b,#e6c77d)}

.rx-kpi b{display:block;font-size:34px;font-weight:800;line-height:1.15;margin:2px 0}
.rx-kpi em{font-style:normal;font-size:12.5px;color:var(--tx3);font-weight:600}

.rx-tl{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;padding-top:4px}

.rx-line i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#e6c77d,#c39a45)}
.rx-ev{position:relative;text-align:center;padding:0 4px}
.rx-pt{position:relative;z-index:1;display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;background:var(--card2);border:3px solid var(--line2);margin-bottom:8px}

.rx-ev.next .rx-pt{border-color:#6366f1;background:#6366f1;box-shadow:0 0 0 6px rgba(99,102,241,.25)}
.rx-ev b{display:block;font-size:13.5px;line-height:1.35}.rx-ev small{font-size:12.5px;color:var(--tx3)}
.rx-ev.next b{color:var(--pri)}.rx-ev.past b{color:var(--tx2)}

.rx-two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}

.rx-fun{display:flex;flex-direction:column}
.rx-fs{display:grid;grid-template-columns:180px 1fr 46px;gap:10px;align-items:center}

.rx-fs.s3 i{background:linear-gradient(90deg,#14b8a6,#0ea5e9)}.rx-fs.s4 i{background:linear-gradient(90deg,#10b981,#14b8a6)}.rx-fs.s5 i{background:linear-gradient(90deg,#22c55e,#10b981)}
.rx-fs.s6 i{background:linear-gradient(90deg,#84cc16,#22c55e)}.rx-fs.s7 i{background:linear-gradient(90deg,#eab308,#84cc16)}.rx-fs.s8 i{background:linear-gradient(90deg,#f59e0b,#e6c77d)}

.rx-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rx-mini div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.rx-mini b{display:block;font-size:22px;font-weight:800}.rx-mini small{font-size:12px;color:var(--tx3)}
.rx-bars{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:16px}

function dlQR() {
  var q = qrcode(0, 'H'); q.addData(applyUrl()); q.make();
  var n = q.getModuleCount(), cell = Math.floor(1600 / n), m = cell * 4, W = n * cell + m * 2, H = W + 170;
  var c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(m + k * cell, m + r * cell, cell, cell);
  x.fillStyle = '#13265a'; x.textAlign = 'center'; x.font = 'bold 64px "Noto Sans Bengali", sans-serif';
  x.fillText('আবেদন করতে স্ক্যান করুন', W / 2, W + 70);

}

function page_sections() {
  return '<div class="ph"><h2>বিভাগ ও প্রধান</h2><span class="sp"></span><button class="btn pri" onclick="editUser(null,\'head\')">' + icon('plus') + 'নতুন বিভাগীয় প্রধান যোগ</button></div>' +
    '<div class="note" style="margin-bottom:14px">বিভাগ = কয়েকটা শ্রেণির দল (যেমন ৫ম–৭ম)। বিভাগীয় প্রধান শুধু নিজের বিভাগের শ্রেণির প্রার্থী, লিখিত নম্বর, ফলাফল, প্যানেলের নম্বর, ডেমো ক্লাস আর প্রতিবেদন দেখেন ও কাজ করেন — অন্য বিভাগ দেখেন না। পুরো প্রতিষ্ঠানের কাজ (লিংক, কোড, ফর্ম, তারিখ, নোটিশ) তাঁর হাতে থাকে না।</div>' +
    '<div id="secbox"><div class="loading"><span class="spin"></span></div></div>';
}
function after_sections() { callServer('apiUsers').then(function (u) { S.users = u; SECS = null; drawSecPage(); }, function (e) { authFail(e); if ($('secbox')) $('secbox').textContent = e.message; }); }
function drawSecPage() {
  var u = S.users, heads = u.users.filter(function (x) { return x.role === 'head'; });
  var h = drawSecs();
  h += '<div class="card"><h3>' + icon('users') + 'বিভাগীয় প্রধান<span class="sp"></span><button class="btn sm" onclick="editUser(null,\'head\')">' + icon('plus') + 'যোগ করুন</button></h3>';
  if (!heads.length) h += '<div class="empty" style="padding:24px">' + icon('users') + 'এখনো কোনো বিভাগীয় প্রধান নেই — "নতুন বিভাগীয় প্রধান যোগ" চাপুন, ইমেইল আর নাম দিয়ে নিচে বিভাগ বাছুন।</div>';
  else h += '<div class="list">' + heads.map(function (x) {
    var i = u.users.indexOf(x), sn = secNamesOf(x.secs);
    return '<div class="row" onclick="editUser(' + i + ')"><span class="chip ' + (x.off ? 'bad' : 'info') + '">' + esc(x.off ? 'বন্ধ' : (u.roles.head || 'বিভাগীয় প্রধান')) + '</span><div class="nm"><b>' + esc(x.name) + '</b><small>' + esc(x.email) + '</small></div>' +
      (sn.length ? sn.map(function (s) { return '<span class="chip ok">' + esc(s) + '</span>'; }).join(' ') : '<span class="chip warn">বিভাগ বাছা হয়নি</span>') + '</div>';
  }).join('') + '</div>';
  h += '<div class="tiny" style="margin-top:10px">কারও নামে চাপলে বদলানো যায় — বিভাগ, ক্ষমতা, সাময়িক বন্ধ বা সরানো। অন্য সব ব্যবহারকারী "ব্যবহারকারী" পাতায়।</div></div>';
  $('secbox').innerHTML = h;
}

/* ═════════════ ফর্মের প্রশ্ন — অ্যাপ থেকে গুগল ফর্মের প্রশ্ন বদলানো ═════════════ */
var QE = { items: null, open: '', types: {} };
var QE_CHOICE = { MULTIPLE_CHOICE: 1, CHECKBOX: 1, LIST: 1 };
var QE_REQ = { TEXT: 1, PARAGRAPH_TEXT: 1, MULTIPLE_CHOICE: 1, CHECKBOX: 1, LIST: 1, DATE: 1 };

function page_qedit() {
  return '<div class="ph"><h2>ফর্মের প্রশ্ন</h2><span class="sp"></span><button class="btn sm" onclick="qeLoad(this)">' + icon('renew') + 'ফর্ম থেকে আবার পড়ো</button></div>' +
    '<div class="note" style="margin-bottom:14px">এখানে বদলালে সঙ্গে সঙ্গে গুগল ফর্মে বসে। 🔒 চিহ্নের অংশ অন্য পাতা থেকে বদলায় (শ্রেণি-বিষয় → "শ্রেণি ও বিষয়", বিজ্ঞপ্তি ও জরুরি কথা → "আবেদন ফর্ম")। নাম, মোবাইল, ছবি আর ঘোষণা মোছা যায় না। নতুন যোগ করা প্রশ্নের উত্তর প্রার্থীর পাতায় "অতিরিক্ত" অংশে দেখাবে।</div>' +
    '<div id="qeList"><div class="loading"><span class="spin"></span> ফর্ম পড়ছি…</div></div>';
}
function after_qedit() { if (QE.items) qeDraw(); else qeLoad(); }
function qeLoad(btn) {
  var p = callServer('apiFormItems');
  (btn ? busy(btn, p) : p).then(function (r) { QE.items = r.items; QE.types = r.types; qeDraw(); },
    function (e) { authFail(e); if ($('qeList')) $('qeList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function qeDraw() {
  var L = QE.items || [], h = '', inSec = false;
  L.forEach(function (it, i) {
    if (it.type === 'PAGE_BREAK') {
      if (inSec) h += '</div>';
      h += '<div class="qsec"><div class="qsech">' + qeCard(it, i, true) + '</div>';
      inSec = true;
    } else {
      if (!inSec) { h += '<div class="qsec"><div class="qsech"><div class="qtt">প্রথম অংশ (বিজ্ঞপ্তি ও শ্রেণি)</div></div>'; inSec = true; }
      h += qeCard(it, i, false);
    }
  });
  if (inSec) h += '</div>';
  $('qeList').innerHTML = h || '<div class="empty">ফর্মে কোনো প্রশ্ন নেই।</div>';
}
function qeCard(it, i, isSec) {
  var lock = it.locked === 'all', open = QE.open === it.id;
  var head = '<div class="qrow' + (lock ? ' lk' : '') + '"' + (lock ? '' : ' onclick="QE.open=QE.open===\'' + it.id + '\'?\'\':\'' + it.id + '\';qeDraw()"') + '>' +
    (isSec ? '' : '<span class="chip">' + esc(QE.types[it.type] || it.type) + '</span>') +
    '<div class="qtt">' + (isSec ? 'অংশ: ' : '') + esc(it.title || '(নাম নেই)') + (it.required ? ' <b style="color:var(--bad)">*</b>' : '') +
    (it.name && it.key !== 'custom' && !isSec ? ' <small>· ' + esc(it.name) + '</small>' : '') + (it.key === 'custom' ? ' <small class="nw">নতুন</small>' : '') + '</div>' +
    (lock ? '<span class="tiny">🔒 ' + esc(it.why) + '</span>' : '<span class="tiny">' + (open ? '▲' : 'বদলাতে চাপুন ▼') + '</span>') + '</div>';
  if (!open || lock) return isSec ? head : '<div class="qcard">' + head + '</div>';
  var f = '<div class="qform">';
  f += '<div class="fld"><label>' + (isSec ? 'অংশের নাম' : 'প্রশ্ন') + '</label><input class="in" id="qe_t"' + (it.locked === 'title' ? ' disabled' : '') + ' value="' + esc(it.title) + '">' + (it.locked === 'title' ? '<div class="hint">🔒 ' + esc(it.why) + '</div>' : '') + '</div>';
  f += '<div class="fld"><label>নিচের ব্যাখ্যা (ঐচ্ছিক)</label><textarea class="in" id="qe_h" rows="2">' + esc(it.help) + '</textarea></div>';
  if (QE_CHOICE[it.type]) {
    f += '<div class="fld"><label>বিকল্প (প্রতি লাইনে একটা)</label><textarea class="in" id="qe_c" rows="' + Math.min(10, (it.choices || []).length + 1) + '"' + (it.locked === 'choices' ? ' disabled' : '') + '>' + esc((it.choices || []).join('\n')) + '</textarea>' +
      (it.locked === 'choices' ? '<div class="hint">🔒 ' + esc(it.why) + '</div>' : '') + '</div>';
    if (it.type !== 'LIST' && it.locked !== 'choices') f += '<div class="fld">' + sw('qe_o', it.other, '"অন্যান্য" ঘর (নিজে লিখতে পারবেন)') + '</div>';
  }
  if (QE_REQ[it.type]) f += '<div class="fld">' + sw('qe_r', it.required, 'আবশ্যক (না দিলে জমা হবে না)') + '</div>';
  f += '<div class="btns"><button class="btn pri" onclick="qeSave(this,\'' + it.id + '\')">সেভ</button>' +
    '<button class="btn sm ghost" title="ওপরে" onclick="qeMove(this,\'' + it.id + '\',-1)">' + icon('up') + '</button><button class="btn sm ghost" title="নিচে" onclick="qeMove(this,\'' + it.id + '\',1)">' + icon('down') + '</button>' +
    '<button class="btn sm" onclick="qeAdd(\'' + it.id + '\')">' + icon('plus') + 'এর পরে নতুন প্রশ্ন</button>' +
    (it.canDelete ? '<button class="btn sm bad" onclick="qeDel(this,\'' + it.id + '\')">' + icon('trash') + 'মুছুন</button>' : '') + '</div></div>';
  return (isSec ? head + f : '<div class="qcard open">' + head + f + '</div>');
}
function qeItem(id) { return (QE.items || []).filter(function (x) { return x.id === id; })[0] || {}; }
function qeSave(btn, id) {
  var it = qeItem(id), o = { id: id, title: $('qe_t').value, help: $('qe_h').value };
  if ($('qe_r')) o.required = $('qe_r').checked;
  if ($('qe_c') && !$('qe_c').disabled) o.choices = $('qe_c').value.split('\n');
  if ($('qe_o')) o.other = $('qe_o').checked;
  busy(btn, callServer('apiFormItemSave', [o])).then(function (r) { QE.items = r.items; QE.open = ''; qeDraw(); toast('ফর্মে বসেছে'); });
}
function qeMove(btn, id, d) { busy(btn, callServer('apiFormItemMove', [id, d])).then(function (r) { QE.items = r.items; qeDraw(); }); }
function qeDel(btn, id) {
  var it = qeItem(id);
  confirmBox('প্রশ্ন মুছবেন?', '"' + esc(it.title) + '" — ফর্ম থেকে মুছে যাবে। এর আগের উত্তরগুলো প্রার্থীর তালিকায় থেকে যাবে।', 'মুছুন').then(function (ok) {
    if (ok) busy(btn, callServer('apiFormItemDelete', [id])).then(function (r) { QE.items = r.items; QE.open = ''; qeDraw(); toast('মুছে গেছে'); });
  });
}
function qeAdd(afterId) {
  var opts = Object.keys(QE.types).filter(function (k) { return k !== 'FILE_UPLOAD'; }).map(function (k) { return '<option value="' + k + '">' + esc(QE.types[k]) + '</option>'; }).join('');
  confirmBox('নতুন প্রশ্ন', 'এই প্রশ্নের ঠিক পরে বসবে। পরে নাম, বিকল্প, আবশ্যক সব বদলাতে পারবেন।', 'যোগ করুন',
    '<div class="fld" style="margin-top:10px"><label>ধরন</label><select class="sel" data-x="type">' + opts + '</select></div>' +
    '<div class="fld"><label>প্রশ্ন</label><input class="in" data-x="title"></div>' +
    '<div class="fld"><label>বিকল্প (বাছাইয়ের প্রশ্ন হলে, প্রতি লাইনে একটা)</label><textarea class="in" data-x="choices" rows="3"></textarea></div>' +
    '<label class="sw"><input type="checkbox" data-x="required"><i></i>আবশ্যক</label>').then(function (x) {
    if (!x) return;
    callServer('apiFormItemAdd', [{ afterId: afterId, type: x.type, title: x.title, required: !!x.required, choices: String(x.choices || '').split('\n') }]).then(function (r) {
      QE.items = r.items; QE.open = ''; qeDraw(); toast('প্রশ্ন যোগ হয়েছে');
    }, function (e) { toast(e.message, 5000); });
  });
}

/* ═════════════ আসন বিন্যাস — কক্ষ, বসানো, চূড়ান্ত, ছাপা ═════════════ */
var SE = { st: null, edit: null };

function page_seat() {
  return '<div class="ph"><h2>আসন বিন্যাস</h2><span class="sp"></span><button class="btn sm" onclick="seLoad(this)">' + icon('renew') + 'হালনাগাদ</button></div><div id="seBox"><div class="loading"><span class="spin"></span></div></div>';
}
function after_seat() { if (SE.st) seDraw(); seLoad(); }
function seLoad(btn) {
  var p = callServer('apiSeatState');
  (btn ? busy(btn, p) : p).then(function (st) { SE.st = st; SE.edit = null; seDraw(); }, function (e) { authFail(e); if ($('seBox')) $('seBox').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function seRooms() { if (!SE.edit) SE.edit = JSON.parse(JSON.stringify(SE.st.rooms)); return SE.edit; }
function seDraw() {
  var st = SE.st, R = seRooms(), h = '';
  var cap = R.reduce(function (t, r) { return t + (r.rows || 0) * (r.benches || 0) * (r.perBench || 0); }, 0);
  var dirty = JSON.stringify(R.map(seClean)) !== JSON.stringify(st.rooms.map(seClean));
  // সারাংশ
  h += '<div class="stats">' +
    '<div class="stat acc"><small>অনুমোদিত প্রার্থী</small><b>' + N(st.approved) + '</b></div>' +
    '<div class="stat"><small>মোট আসন</small><b>' + N(cap) + '</b></div>' +
    '<div class="stat ok"><small>বসানো হয়েছে</small><b>' + N(st.seated) + '</b></div>' +
    '<div class="stat ' + (st.unseated ? 'warn' : '') + '"><small>আসন বাকি</small><b>' + N(st.unseated) + '</b></div></div>';
  if (cap < st.approved) h += '<div class="note bad" style="margin-bottom:12px">⚠️ আসন ' + N(st.approved - cap) + 'টি কম — কক্ষ যোগ করুন বা বেঞ্চ বাড়ান।</div>';
  // কক্ষের তালিকা
  h += '<div class="card"><h3>' + icon('home') + 'কক্ষ<span class="sp"></span><button class="btn sm" onclick="seAdd()">' + icon('plus') + 'কক্ষ যোগ</button></h3>';
  if (!R.length) h += '<div class="empty">' + icon('home') + 'এখনো কোনো কক্ষ নেই — "কক্ষ যোগ" চাপুন।</div>';
  else h += '<div class="tw"><table class="t rm"><tr><th>তলা</th><th>কক্ষ</th><th>সারি</th><th>সারিতে বেঞ্চ</th><th>বেঞ্চে কয়জন</th><th style="text-align:right">আসন</th><th style="text-align:right">বসানো</th><th></th></tr>' +
    R.map(function (r, i) {
      var c = (r.rows || 0) * (r.benches || 0) * (r.perBench || 0);
      return '<tr><td><input class="in" value="' + esc(r.floor) + '" placeholder="যেমন ৩য়" oninput="SE.edit[' + i + '].floor=this.value" onchange="seDraw()"></td>' +
        '<td><input class="in" value="' + esc(r.name) + '" placeholder="যেমন ৩০২" oninput="SE.edit[' + i + '].name=this.value" onchange="seDraw()"></td>' +
        ['rows', 'benches', 'perBench'].map(function (k) { return '<td><input class="in" type="number" min="1" value="' + esc(r[k]) + '" onchange="SE.edit[' + i + '].' + k + '=+this.value;seDraw()"></td>'; }).join('') +
        '<td style="text-align:right;font-weight:700">' + N(c) + '</td><td style="text-align:right">' + N(r.used || 0) + '</td>' +
        '<td style="white-space:nowrap"><button class="btn sm ghost" onclick="seMv(' + i + ',-1)">' + icon('up') + '</button><button class="btn sm ghost" onclick="seMv(' + i + ',1)">' + icon('down') + '</button>' +
        (r.used ? '' : '<button class="btn sm ghost" onclick="SE.edit.splice(' + i + ',1);seDraw()">' + icon('trash') + '</button>') + '</td></tr>';
    }).join('') + '</table></div>';
  if (dirty) h += '<div class="btns" style="margin-top:10px"><button class="btn pri" onclick="seSaveRooms(this)">কক্ষের তালিকা সেভ</button><button class="btn" onclick="SE.edit=null;seDraw()">বদল বাদ দিন</button></div>';
  h += '<div class="tiny" style="margin-top:8px">ক্রম = প্রার্থী বসানোর ক্রম (ওপরের কক্ষ আগে ভরে)। আসন নম্বর সারি ধরে: ১ম সারির ১ম বেঞ্চ থেকে।</div></div>';
  // বসানো ও চূড়ান্ত
  h += '<div class="card"><h3>' + icon('users') + 'প্রার্থী বসানো<span class="sp"></span>' + (st.locked ? '<span class="chip ok">🔒 চূড়ান্ত</span>' : '<span class="chip warn">খসড়া</span>') + '</h3>';
  h += '<div class="muted" style="margin-bottom:12px;line-height:1.7">"সাজাও" চাপলে সব অনুমোদিত প্রার্থী কক্ষে বসবেন — পাশাপাশি দুজন যতটা সম্ভব আলাদা শ্রেণি-বিষয়ের। ' +
    'চূড়ান্ত করলে প্রার্থীরা প্রবেশপত্রের পাতায় নিজের <b>তলা ও কক্ষ</b> দেখবেন (বেঞ্চ নয়)। চূড়ান্তের পরে নতুন অনুমোদিতদের "বাকিদের বসাও" দিয়ে খালি আসনে বসান।</div><div class="btns">';
  if (!st.locked) h += '<button class="btn gold" onclick="seGen(this)"' + (dirty ? ' disabled title="আগে কক্ষের তালিকা সেভ করুন"' : '') + '>' + icon('renew') + (st.seated ? 'আবার সাজাও' : 'সাজাও') + '</button>' +
    '<button class="btn ok" onclick="seLock(this,true)"' + (st.seated ? '' : ' disabled') + '>' + icon('lock') + 'চূড়ান্ত করো</button>';
  else h += '<button class="btn" onclick="seFill(this)"' + (st.unseated ? '' : ' disabled') + '>' + icon('plus') + 'বাকিদের বসাও' + (st.unseated ? ' (' + N(st.unseated) + ')' : '') + '</button>' +
    '<button class="btn bad" onclick="seLock(this,false)">তালা খুলুন</button>';
  h += '</div></div>';
  // ছাপা
  h += '<div class="card"><h3>' + icon('dl') + 'ছাপার কাগজ (A4)</h3><div class="btns">' +
    '<button class="btn" onclick="sePrint(this,\'door\')">দরজার তালিকা</button>' +
    '<button class="btn" onclick="sePrint(this,\'sticker\')">বেঞ্চের স্টিকার (পাতায় ২৪টা)</button>' +
    '<button class="btn" onclick="sePrint(this,\'attend\')">হাজিরা-সইয়ের খাতা</button>' +
    '<button class="btn" onclick="sePrint(this,\'qcount\')">প্রশ্নের হিসাব</button></div>' +

/* ---------- একটা শ্রেণি-বিষয়: নিয়ম, মেধাক্রম, চূড়ান্ত ---------- */
function rsOpen(id) {
  RS.sub = id; RS.grp = null; RS.sel = {};
  if (RS.st) rsDraw();
  $('rsGrp').innerHTML = '<div class="loading"><span class="spin"></span></div>';
  callServer('apiResultGroup', [id]).then(function (g) { if (RS.sub !== id) return; rsSetGrp(g); $('rsGrp').scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    function (e) { authFail(e); $('rsGrp').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function rsSetGrp(g) {
  RS.grp = g;
  var r = g.rule || {};
  RS.rule = { mode: r.mode || '', pass: r.pass || '', wait: r.wait || '', over: JSON.parse(JSON.stringify(r.over || {})) };
  rsGrpDraw();
}
// সার্ভারের computeGroup_-এর মতোই (তাৎক্ষণিক প্রিভিউ)
function rsCompute(people, rule) {
  var over = rule.over || {}, L = people.map(function (p) { return Object.assign({}, p); });
  var ranked = L.filter(function (p) { return p.mk !== null; }).sort(function (a, b) { return b.mk - a.mk || (a.roll < b.roll ? -1 : 1); }), rank = 0;
  ranked.forEach(function (p, i) { if (i === 0 || p.mk !== ranked[i - 1].mk) rank = i + 1; p.rank = rank; });
  var P = +rule.pass || 0, W = +rule.wait || 0;
  L.forEach(function (p) {
    var r = '';
    if (p.mk === null) r = p.present ? 'missing' : 'absent';
    else if (rule.mode === 'cut') r = p.mk >= P ? 'pass' : (W > 0 && W < P && p.mk >= W ? 'wait' : 'fail');
    else if (rule.mode === 'top') r = p.rank <= P ? 'pass' : (p.rank <= P + W ? 'wait' : 'fail');
    else if (rule.mode === 'manual') r = 'fail';
    p.auto = r;
    if (p.mk !== null && rule.mode && /^(pass|wait|fail)$/.test(over[p.roll] || '')) r = over[p.roll];
    p.calc = r;

function trAuto() {
  var load = {}; TR.days.forEach(function (d) { load[d.id] = 0; });
  var plan = {};
  TR.st.subs.slice().sort(function (a, b) { return b.n - a.n; }).forEach(function (x) {
    var free = TR.days.map(function (d) { return { d: d, f: d.cap - load[d.id] }; }).sort(function (a, b) { return b.f - a.f || a.d.date.localeCompare(b.d.date); });
    var best = free[0];
    if (!best) return;
    if (x.n <= best.f || !free[1] || best.f <= 0) { plan[x.id] = [{ d: best.d.id, n: 0 }]; load[best.d.id] += x.n; }
    else { plan[x.id] = [{ d: best.d.id, n: best.f }, { d: free[1].d.id, n: 0 }]; load[best.d.id] += best.f; load[free[1].d.id] += x.n - best.f; }
  });
  TR.plan = plan; trDraw(); toast('সাজানো হয়েছে — দেখে "সেভ" বা "চূড়ান্ত" করুন');

/* ═════════════ প্রচার — দেয়ালের A4 পোস্টার আর ফেসবুকের ছবি ও লেখা, সব অ্যাপের তথ্য থেকে নিজে ═════════════

var PR = { cls: 0, days: null };

function prData() {
  var s = S.boot.settings, L = s.links || {}, groups = [];
  S.boot.subjects.filter(function (x) { return x.active; }).forEach(function (x) {
    var g = groups.filter(function (y) { return y[0] === x.cls; })[0];
    if (!g) { g = [x.cls, []]; groups.push(g); }
    g[1].push(x.subject);
  });
  var full = function (u) { u = String(u || '').trim(); return u ? (/^https?:\/\//.test(u) ? u : 'https://' + u) : ''; };
  var org = s.orgNames || 'টেকনিক ইজি এডুকেশন ও টেকনিক টিচিং হোম';
  return {
    D: {
      year: s.year || '২০২৭', deadline: s.deadline, examDate: s.examDate, examStart: s.examStart, examEnd: s.examEnd,
      resultDate: s.resultDate, trainingFrom: s.trainingFrom, trainingTo: s.trainingTo,
      orgNames: org, posterOrg: org.split(' ও ').pop(), address: s.address || '', phones: s.phones || '',
      web: L.web || '', fb: L.fb || '', warning: String(s.warning || '').replace(/^\s*⚠️?\s*/, ''),
      apply: full(s.shareUrl) || S.boot.site + '/apply/', map: full(s.mapUrl)
    },
    SUB: groups
  };
}

function prDaysLeft() {

  if (dl.length < 3) return null;
  var now = new Date(Date.now() + 6 * 3600000), t0 = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  return Math.round((Date.UTC(+dl[0], +dl[1] - 1, +dl[2]) - t0) / 86400000);
}

function prSrc(it, extra) {

function after_promo() {
  PR.stamp = PR.stamp || Date.now();
  try { localStorage.setItem('rc_promo', JSON.stringify(prData())); } catch (e) {}
  PR_ITEMS.forEach(function (it) { if (!it.poster) prCap(it.key); });
}
function prRefresh() { PR.stamp = Date.now(); render(); toast('নতুন তথ্যে হালনাগাদ হয়েছে'); }
function prItem(key) { return PR_ITEMS.filter(function (x) { return x.key === key; })[0]; }
function prReload(key) { var it = prItem(key), f = $('pf_' + key); if (f) f.src = prSrc(it); if (key === 'K') prCap('K'); }
function prOpen(key) { window.open(prSrc(prItem(key)).replace('&embed=1', ''), '_blank'); }
function prPrint(key) {
  try { localStorage.setItem('rc_promo', JSON.stringify(prData())); } catch (e) {}
  window.open(prSrc(prItem(key)).replace('&embed=1', '') + '&print=1', '_blank');
}
function prDownload(url, name) { var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function prClsFile(i) { var c = (prData().SUB[i] || [''])[0]; return 'fb-class-' + String(c).replace(/[০-৯]/g, function (d) { return '০১২৩৪৫৬৭৮৯'.indexOf(d); }).replace(/[^\w-]+/g, '') + '.png'; }
function prShot(frame, it) {
  var w = frame && frame.contentWindow;
  if (!w || !w.promoPng) return Promise.reject(new Error('ছবি এখনো তৈরি হচ্ছে — কয়েক সেকেন্ড পরে আবার চাপুন।'));
  return w.promoPng(it.poster ? 2 : 1);
}
function prPng(btn, key) {
  var it = prItem(key);
  busy(btn, prShot($('pf_' + key), it)).then(function (url) {
    prDownload(url, it.cls ? prClsFile(PR.cls) : it.file + '.png'); toast('ছবি নামানো হয়েছে');
  });
}
// সব শ্রেণির ছবি — একটা লুকানো iframe-এ একে একে তৈরি
function prAllCls(btn) {
  var it = prItem('K'), n = prData().SUB.length, i = 0;
  var f = document.createElement('iframe'); f.style.cssText = 'position:fixed;left:-3000px;top:0;width:1080px;height:1350px;border:0';
  document.body.appendChild(f);
  var p = new Promise(function (ok, bad) {
    function next() {
      if (i >= n) { f.remove(); return ok(); }
      f.onload = function () { prShot(f, it).then(function (url) { prDownload(url, prClsFile(i)); i++; setTimeout(next, 300); }, function (e) { f.remove(); bad(e); }); };
      f.src = 'promo/?v=K&embed=1&c=' + i + '&t=' + PR.stamp;
    }
    next();
  });
  busy(btn, p).then(function () { toast(N(n) + 'টি শ্রেণির ছবি নামানো হয়েছে'); });
}

function prCaption(key) {

  var tags = '\n\n#শিক্ষক_নিয়োগ #শিক্ষক_নিয়োগ_' + y + ' #পার্টটাইম_চাকরি #মিরপুর #শেওড়াপাড়া #টেকনিক_টিচিং_হোম';
  var foot = '\n\n⚠️ ' + D.warning + '\n\n📍 ' + D.address + '\n☎ ' + D.phones;
  var dates = '📅 আবেদনের শেষ তারিখ: ' + prDt(D.deadline, true) + '\n📝 লিখিত পরীক্ষা: ' + prDt(D.examDate, true) + ', ' + prTime(D.examStart, D.examEnd);
  var subj = d.SUB.map(function (c) { return '🔹 ' + c[0] + ' শ্রেণি: ' + c[1].join(', '); }).join('\n');
  if (key === 'G') return '📢 শিক্ষক-শিক্ষিকা নিয়োগ বিজ্ঞপ্তি ' + y + '\n\n' + D.orgNames + '-এ ' + y + ' সালের জন্য পঞ্চম থেকে দ্বাদশ শ্রেণির বিভিন্ন বিষয় পড়াতে আগ্রহী কিছু সংখ্যক দক্ষ, মেধাবী ও পরিশ্রমী শিক্ষক-শিক্ষিকা নিয়োগ দেওয়া হবে।\n\n' +
    '✅ যোগ্যতা: ন্যূনতম স্নাতক অধ্যয়নরত\n✅ ধরন: পার্টটাইম · আবেদন ফি নেই\n' + dates + '\n\n👉 আবেদন করতে ভিজিট করুন: ' + link + '\n\nশ্রেণি ও বিষয়ের পুরো তালিকা আবেদনের লিংকে আছে।' + foot + tags;
  if (key === 'M') return '📢 শিক্ষক-শিক্ষিকা নিয়োগ ' + y + ' — শ্রেণি, বিষয় ও তারিখ\n\n✅ যোগ্যতা: ন্যূনতম স্নাতক অধ্যয়নরত\n✅ ধরন: পার্টটাইম · আবেদন ফি নেই\n📝 যেকোনো ১টি শ্রেণির ১টি বিষয়ে আবেদন করা যাবে।\n\n📚 নিয়োগের শ্রেণি ও বিষয়:\n' + subj + '\n\n' + dates +
    '\n\n👉 আবেদন করতে ভিজিট করুন: ' + link + foot + tags;
  if (key === 'K') {
    var c = d.SUB[PR.cls] || ['', []];
    return '📚 ' + c[0] + ' শ্রেণির শিক্ষক-শিক্ষিকা নিয়োগ ' + y + '\n\nবিষয়: ' + c[1].join(', ') + '\n\n✅ যোগ্যতা: ন্যূনতম স্নাতক অধ্যয়নরত · ধরন: পার্টটাইম\n📝 যেকোনো ১টি বিষয়ে আবেদন করা যাবে।\n📅 আবেদনের শেষ তারিখ: ' + prDt(D.deadline, true) +
      '\n\n👉 আবেদন করতে ভিজিট করুন: ' + link + foot + tags;
  }
  if (key === 'L') {
    var n = PR.days != null ? PR.days : prDaysLeft();
    var head = n == null ? '⏰ আবেদনের সময় শেষ হচ্ছে!' : n < 0 ? '⏰ আবেদনের সময় শেষ হয়েছে।' : n === 0 ? '⏰ আজই আবেদনের শেষ দিন!' : '⏰ আর মাত্র ' + N(n) + ' দিন বাকি!';
    return head + '\n\nশিক্ষক-শিক্ষিকা নিয়োগ ' + y + '-এর আবেদনের শেষ তারিখ ' + prDt(D.deadline, true) + ', রাত ১১:৫৯ পর্যন্ত। যাঁরা এখনো আবেদন করেননি, দেরি না করে আজই আবেদন করুন।\n\n👉 আবেদন করতে ভিজিট করুন: ' + link + foot + tags;
  }
  return '';
}
function prCap(key) { var el = $('pc_' + key); if (el) el.value = prCaption(key); }
