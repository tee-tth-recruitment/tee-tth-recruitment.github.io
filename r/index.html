<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফলাফল — শিক্ষক নিয়োগ ২০২৭</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/tth-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e9ecf2;font-family:'Noto Sans Bengali',sans-serif;color:#14203f}
.top{background:#13265a;color:#fff;text-align:center;padding:22px 16px 46px}
.top img{width:56px;height:56px;margin:0 5px;background:#fff;border-radius:50%;padding:4px}
.top h1{font-family:'Baloo Da 2',sans-serif;font-size:26px;line-height:1.35;margin:10px 0 2px;padding-top:2px}
.top p{margin:0;color:#e6c77d;font-size:14px;font-weight:600}
.box{max-width:460px;margin:-30px auto 0;background:#fff;border:1px solid #dde3f0;border-radius:18px;padding:24px 20px;box-shadow:0 8px 24px rgba(20,32,63,.10);position:relative}
.box label{display:block;font-size:14px;font-weight:600;color:#4a5675;margin:12px 0 4px}
.box input{width:100%;padding:13px 12px;border:1px solid #c9d2e6;border-radius:10px;font:17px 'Noto Sans Bengali',sans-serif;letter-spacing:.5px}
.box input:focus{outline:2px solid #c39a45;border-color:#c39a45}
.go{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:linear-gradient(180deg,#e6c77d,#c39a45);color:#1b1404;font:700 17px 'Noto Sans Bengali',sans-serif;cursor:pointer}
.go:disabled{opacity:.6}
.ghost{background:#f1f4fa;color:#13265a}
.err{color:#b4532a;min-height:20px;margin-top:10px;font-size:14px;text-align:center;line-height:1.5}
.hint{font-size:13px;color:#6b7591;text-align:center;margin-top:12px;line-height:1.6}
.badge{border-radius:14px;text-align:center;padding:18px 12px;margin-bottom:16px}
.badge small{display:block;font-size:14px;font-weight:600;opacity:.85}
.badge b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:36px;line-height:1.35;padding-top:4px}
.b-pass{background:linear-gradient(135deg,#13265a,#24408f);color:#fff;box-shadow:0 0 0 3px #e6c77d inset}
.b-pass b{color:#e6c77d}
.b-wait{background:#fff8e1;color:#7a5a12;border:1px solid #f0d58a}
.b-fail,.b-absent,.b-cancelled,.b-notyet{background:#f1f4fa;color:#3d4866;border:1px solid #dde3f0}
.b-before{background:#13265a;color:#fff}
.b-before b{color:#e6c77d;font-size:26px}
.who{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin-bottom:14px}
.who dt{color:#6b7591}.who dd{margin:0;font-weight:700}
.msg{font-size:15.5px;line-height:1.8;background:#f8f9fc;border-radius:12px;padding:14px 16px}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.links a{font-size:14px;color:#13265a;background:#f1f4fa;border-radius:999px;padding:7px 14px;text-decoration:none;font-weight:600}
.prog{height:6px;background:#e6ebf5;border-radius:6px;overflow:hidden;margin:18px 0 8px}
.prog i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#c39a45,#e6c77d);border-radius:6px;animation:pg 1.4s ease-in-out infinite}
@keyframes pg{0%{margin-left:-30%}100%{margin-left:100%}}
.dev{text-align:center;font-size:12px;color:#7b86a3;margin:22px 0}
.train{margin-top:14px;border-radius:14px;padding:14px 16px;background:#fff8e1;border:1px solid #f0d58a}
.train small{display:block;font-size:13px;font-weight:700;color:#7a5a12;margin-bottom:6px}
.train dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:15px}.train dt{color:#7a5a12}.train dd{margin:0;font-weight:700;color:#14203f}
</style>
<script>var API_URL = 'https://script.google.com/macros/s/AKfycbyfL1EUYdUrfEqIwvBVi2Ia8J8sEqXA4Byo78EaccmH-9oIb3YAnHil0SjlUS-YdFCH/exec';</script>
</head>
<body>
<div class="top"><img src="../assets/tee-logo.png" alt=""><img src="../assets/tth-logo.png" alt="">
  <h1>লিখিত পরীক্ষার ফলাফল</h1><p>শিক্ষক-শিক্ষিকা নিয়োগ ২০২৭ · টেকনিক ইজি এডুকেশন ও টেকনিক টিচিং হোম</p></div>
<div class="box" id="root"><div class="prog"><i></i></div></div>
<div class="dev">Developed By: Md. Ashraful Islam</div>
<script>
var root = document.getElementById('root');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function N(x) { return String(x == null ? '' : x).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
// ভিড়ের সময় সার্ভার ব্যস্ত থাকলে নিজে আবার চেষ্টা (৫ বার পর্যন্ত)
function call(fn, args, tries, onRetry) {
  tries = tries || 0;
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) return j.data;
      var m = (j && j.error) || 'সমস্যা হয়েছে।';
      if (/অনেকে একসাথে|too many|Service|timed out|LockService|invoked/i.test(m)) throw { busy: true, message: m };
      throw new Error(m);
    }).catch(function (e) {
      if (e instanceof Error && !/Failed to fetch|NetworkError|JSON|Load failed/i.test(e.message)) throw e;
      if (tries >= 5) throw new Error('এখন অনেকে একসাথে ফল দেখছেন — একটু পরে আবার চেষ্টা করুন।');
      if (onRetry) onRetry(tries + 1);
      return sleep([1500, 3000, 5000, 8000, 12000][tries] + Math.random() * 1500).then(function () { return call(fn, args, tries + 1, onRetry); });
    });
}
function linksHtml(d) {
  var L = d.links || {}, a = [];
  if (L.fb) a.push('<a href="https://' + esc(String(L.fb).replace(/^https?:\/\//, '')) + '" target="_blank" rel="noopener">ফেসবুক পেজ</a>');
  if (L.web) a.push('<a href="https://' + esc(String(L.web).replace(/^https?:\/\//, '')) + '" target="_blank" rel="noopener">ওয়েবসাইট</a>');
  if (d.helpline) a.push('<a href="tel:' + esc(String(d.helpline).replace(/[০-৯]/g, function (x) { return '০১২৩৪৫৬৭৮৯'.indexOf(x); }).replace(/[^\d+]/g, '')) + '">☎ ' + esc(d.helpline) + '</a>');
  return a.length ? '<div class="links">' + a.join('') + '</div>' : '';
}
function form(err, roll) {
  var saved = ''; try { saved = roll || localStorage.getItem('rc_res_roll') || ''; } catch (e) {}
  root.innerHTML = '<label for="fr">রোল নম্বর</label><input id="fr" inputmode="numeric" maxlength="6" placeholder="প্রবেশপত্রে লেখা ৬ অঙ্কের রোল" value="' + esc(saved) + '">' +
    '<label for="fm">মোবাইল নম্বর</label><input id="fm" inputmode="tel" placeholder="আবেদনে দেওয়া মোবাইল নম্বর">' +
    '<button class="go" id="fgo">ফল দেখুন</button><div class="err" id="fe">' + esc(err || '') + '</div>';
  var go = document.getElementById('fgo');
  go.onclick = function () {
    var r = document.getElementById('fr').value.trim(), m = document.getElementById('fm').value.trim(), fe = document.getElementById('fe');
    if (!r || !m) { fe.textContent = 'রোল ও মোবাইল নম্বর দুটোই দিন।'; return; }
    go.disabled = true; go.textContent = 'খুঁজছি…'; fe.textContent = '';
    try { localStorage.setItem('rc_res_roll', r); } catch (e) {}
    call('apiResult', [r, m], 0, function (n) { go.textContent = 'অনেকে একসাথে দেখছেন — আবার চেষ্টা (' + N(n) + ')…'; })
      .then(show, function (e) { go.disabled = false; go.textContent = 'ফল দেখুন'; fe.textContent = e.message; });
  };
  document.getElementById('fm').onkeydown = function (e) { if (e.key === 'Enter') go.click(); };
}
function show(d) {
  if (d.state === 'before') {
    root.innerHTML = '<div class="badge b-before"><small>ফল প্রকাশ হবে</small><b>' + esc(d.at) + '</b></div>' +
      '<div class="msg">ঠিক এই সময়ের পর এই পাতাতেই রোল ও মোবাইল নম্বর দিয়ে আপনার ফল দেখতে পাবেন।</div>' + linksHtml(d) +
      '<button class="go ghost" onclick="form()">ফিরে যান</button>';
    return;
  }
  var lab = d.state === 'pass' ? '🎉 উত্তীর্ণ' : d.state === 'cancelled' ? 'আবেদন বাতিল' : d.state === 'notyet' ? 'এখনো প্রকাশ হয়নি' : d.label;
  root.innerHTML = '<div class="badge b-' + esc(d.state) + '"><small>আপনার ফল</small><b>' + esc(lab) + '</b></div>' +
    '<dl class="who"><dt>নাম</dt><dd>' + esc(d.name) + '</dd><dt>রোল</dt><dd>' + esc(d.roll) + '</dd><dt>শ্রেণি-বিষয়</dt><dd>' + esc(d.cs) + '</dd></dl>' +
    '<div class="msg">' + esc(d.msg).replace(/\n/g, '<br>') + '</div>' +
    (d.train ? '<div class="train"><small>📅 প্রশিক্ষণ ও ডেমো ক্লাস</small><dl><dt>দিন</dt><dd>' + esc(d.train.date) + '</dd><dt>সময়</dt><dd>' + esc(d.train.time) + '</dd><dt>স্থান</dt><dd>' + esc(d.train.venue) + '</dd></dl></div>' : '') + linksHtml(d) +
    '<button class="go ghost" onclick="location.hash=\'\';form()">অন্য রোল দেখুন</button>';
}
function load() {
  var tok = (location.hash || '').replace(/^#/, '').trim();
  if (!tok) return form();
  root.innerHTML = '<div class="prog"><i></i></div><div class="hint" id="wt">আপনার ফল আনা হচ্ছে…</div>';
  call('apiResultT', [tok], 0, function (n) { var w = document.getElementById('wt'); if (w) w.textContent = 'অনেকে একসাথে দেখছেন — আবার চেষ্টা (' + N(n) + ')…'; })
    .then(show, function (e) { form(e.message); });
}
window.addEventListener('hashchange', function () { if (location.hash.length > 1) load(); });
load();
</script>
</body>
</html>
